name: Build Binaries with FFmpeg

on:
  push:
    tags:
      - 'v*'  # Builds on version tags like v1.0
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.display }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          # macOS Intel (x86_64)
          - display: macos-x64
            os: macos
            arch: x64
            runs-on: macos-latest
          # macOS Apple Silicon (arm64)
          - display: macos-arm64
            os: macos
            arch: arm64
            runs-on: macos-14

          # Linux x86_64
          - display: ubuntu-x64
            os: linux
            arch: x64
            runs-on: ubuntu-22.04
          # Linux arm64
          - display: ubuntu-arm64
            os: linux
            arch: arm64
            runs-on: ubuntu-22.04-arm

          # Windows x64
          - display: windows-x64
            os: windows
            arch: x64
            runs-on: windows-2022
          # Windows ARM
          - display: windows-arm64
            os: windows
            arch: arm64
            runs-on: windows-11-arm

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew update || true
            brew install python-tk
          fi

      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          printf "%s" "$MAC_CERT_P12_BASE64" | base64 --decode > developer_id.p12
          security create-keychain -p "" build.keychain
          security import developer_id.p12 -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain || true
          rm developer_id.p12

      - name: Download FFmpeg
        shell: bash
        run: |
          mkdir -p ffmpeg

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            if [[ "${{ matrix.arch }}" == "x64" ]]; then
              curl -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
              unzip ffmpeg.zip -d ffmpeg
            else
              curl -L -o ffmpeg.zip https://github.com/tordona/ffmpeg-win-arm64/releases/latest/download/ffmpeg-win-arm64.zip || true
              if [ -f ffmpeg.zip ]; then unzip ffmpeg.zip -d ffmpeg; fi
            fi

          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            if [[ "${{ matrix.arch }}" == "arm64" ]]; then
              brew install ffmpeg || true
              if [ -x /opt/homebrew/bin/ffmpeg ]; then
                cp /opt/homebrew/bin/ffmpeg ffmpeg/ffmpeg
              elif command -v ffmpeg >/dev/null 2>&1; then
                cp "$(command -v ffmpeg)" ffmpeg/ffmpeg
              else
                echo "brew ffmpeg not found; listing /usr/local and /opt/homebrew"
                ls -l /usr/local/bin || true
                ls -l /opt/homebrew/bin || true
                exit 1
              fi
            else
              curl -L -o ffmpeg.zip https://evermeet.cx/ffmpeg/getrelease/zip
              unzip -o ffmpeg.zip -d ffmpeg
            fi
            chmod +x ffmpeg/ffmpeg || true
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            if [[ "${{ matrix.arch }}" == "x64" ]]; then
              curl -L -o ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
              tar -xf ffmpeg.tar.xz --strip-components=1 -C ffmpeg
            else
              curl -L -o ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-arm64-static.tar.xz
              tar -xf ffmpeg.tar.xz --strip-components=1 -C ffmpeg
            fi
          fi

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller SedPlot.py --noconfirm --onefile --add-data "ffmpeg:ffmpeg"
          chmod +x dist/SedPlot*


      - name: Code sign binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BINARY_PATH="dist/SedPlot"
          IDENTITY=$(security find-identity -p codesigning -v | grep -E 'Developer ID Application|Mac Developer' | head -n1 | awk -F\" '{print $2}')
          echo "Using identity: $IDENTITY"
          security unlock-keychain -p "" build.keychain
          codesign --verbose=4 --force --deep --options runtime --timestamp --entitlements .github/mac_build_tools/entitlements.plist --sign "$IDENTITY" "$BINARY_PATH"
          codesign --verify --verbose=4 "$BINARY_PATH"

          echo "Moving contents to SedPlot.app"
          mkdir -p dist/SedPlot.app/Contents/MacOS
          mv "$BINARY_PATH" dist/SedPlot.app/Contents/MacOS
          cp .github/mac_build_tools/Info.plist dist/Sedplot.app/Contents
          echo -n "APPL????" > dist/SedPlot.app/Contents/PkgInfo

          echo "Signing App"
          codesign --verbose=4 --force --deep --options runtime --timestamp --entitlements .github/mac_build_tools/entitlements.plist --sign "$IDENTITY" dist/SedPlot.app
          codesign --verify --verbose=4 dist/SedPlot.app
          codesign --display --entitlements :- dist/SedPlot.app

      - name: Notarize Binary
        if: runner.os == 'macOS'
        shell: bash
        env:
          AC_API_KEY: ${{ secrets.AC_API_KEY }}
          AC_KEY_ID: ${{ secrets.AC_KEY_ID }}
          AC_ISSUER_ID: ${{ secrets.AC_ISSUER_ID }}
        run: |
          cd dist

          echo "Zipping and checking the zip"
          ditto -c -k --keepParent SedPlot.app SedPlot.zip
          zipinfo -1 SedPlot.zip | head
          
          echo "$AC_API_KEY" > AuthKey.p8
          SUBMISSION_ID=$(xcrun notarytool submit SedPlot.zip \
            --key AuthKey.p8 \
            --key-id "$AC_KEY_ID" \
            --issuer "$AC_ISSUER_ID" \
            --team-id "PHMNSQWNJR" \
            --output-format json | jq -r '.id')

          echo "Submitted notarization with ID: $SUBMISSION_ID"

          for i in {1..40}; do
            STATUS=$(xcrun notarytool info "$SUBMISSION_ID" \
              --key AuthKey.p8 \
              --key-id "$AC_KEY_ID" \
              --issuer "$AC_ISSUER_ID" \
              --team-id "PHMNSQWNJR" \
              --output-format json | jq -r '.status')
            echo "Current status: $STATUS"
            [[ "$STATUS" == "Accepted" || "$STATUS" == "Invalid" ]] && break
            sleep 30
          done

          xcrun notarytool log "$SUBMISSION_ID" \
            --key AuthKey.p8 \
            --key-id "$AC_KEY_ID" \
            --issuer "$AC_ISSUER_ID" \
            --team-id "PHMNSQWNJR"
          rm AuthKey.p8

          cd ..
          xcrun stapler staple dist/SedPlot.app
          xcrun stapler validate dist/SedPlot.app

          spctl -a -vvv dist/SedPlot.app
          rm dist/SedPlot.zip


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SedPlot-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
