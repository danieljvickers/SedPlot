name: Build Binaries with FFmpeg

on:
  # push:
  #   tags:
#      - 'v*'  # Builds on version tags like v1.0
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
#        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install python-tk
          fi

      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          printf "%s" "$MAC_CERT_P12_BASE64" | base64 --decode > developer_id.p12
          security create-keychain -p "" build.keychain
          security import developer_id.p12 -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain || true
          rm developer_id.p12

      - name: Download FFmpeg
        shell: bash
        run: |
          mkdir -p ffmpeg
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            curl -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
            unzip ffmpeg.zip -d ffmpeg
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            curl -L -o ffmpeg.zip https://evermeet.cx/ffmpeg/getrelease/zip
            unzip ffmpeg.zip -d ffmpeg
            chmod +x ffmpeg/ffmpeg
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            curl -L -o ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xf ffmpeg.tar.xz --strip-components=1 -C ffmpeg
          fi

      - name: Build with PyInstaller
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            pyinstaller SedPlot.py --noconfirm --onedir --name "SedPlot" --add-data "ffmpeg:ffmpeg"
          else
            pyinstaller SedPlot.py --noconfirm --onefile --add-data "ffmpeg:ffmpeg"
          fi


      - name: Code sign binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_PATH="dist/SedPlot"
          mv "$APP_PATH" "$APP_PATH.app"
          APP_EXECUTABLE=$(find "dist/SedPlot.app" -type f -name "SedPlot" -perm +111 | head -n 1)
          FFMPEG_BINARY=$(find "dist/SedPlot.app" -type f -name "ffmpeg" -perm +111 | head -n 1)
          IDENTITY=$(security find-identity -p codesigning -v | grep -E 'Developer ID Application|Mac Developer' | head -n1 | awk -F\" '{print $2}')

          echo "Using identity: $IDENTITY"
          security unlock-keychain -p "" build.keychain

          echo "Signing FFmpeg at: $FFMPEG_BINARY"
          codesign --verbose=4 --force --options runtime --timestamp --sign "$IDENTITY" "$FFMPEG_BINARY"

          echo "Signing SedPlot Executable at: $APP_EXECUTABLE"
          codesign --verbose=4 --force --options runtime --timestamp --sign "$IDENTITY" "$APP_EXECUTABLE"

          echo "Signing all internal dynamic libraries (.dylib & .so)"
          find "dist/SedPlot.app" -type f -name "*.dylib" -exec codesign --verbose=4 --force --options runtime --timestamp --sign "$IDENTITY" {} \;
          find "dist/SedPlot.app" -type f -name "*.so" -exec codesign --verbose=4 --force --options runtime --timestamp --sign "$IDENTITY" {} \;

          echo "Signing App at: dist/SedPlot.app"
          codesign --verbose=4 --force --options runtime --timestamp --entitlements .github/codesign_xml/entitlements.plist --sign "$IDENTITY" "dist/SedPlot.app"

          codesign --verify --verbose=4 "dist/SedPlot.app"

      - name: Notarize Binary
        if: runner.os == 'macOS'
        shell: bash
        env:
          AC_API_KEY: ${{ secrets.AC_API_KEY }}
          AC_KEY_ID: ${{ secrets.AC_KEY_ID }}
          AC_ISSUER_ID: ${{ secrets.AC_ISSUER_ID }}
        run: |
          zip -r dist/SedPlot.zip dist/SedPlot.app
          
          echo "$AC_API_KEY" > AuthKey.p8
          xcrun notarytool submit dist/SedPlot.zip \
            --key AuthKey.p8 \
            --key-id "$AC_KEY_ID" \
            --issuer "$AC_ISSUER_ID" \
            --wait
          xcrun stapler staple dist/SedPlot.app
          xcrun stapler validate dist/SedPlot.app


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-binary
          path: dist/*

