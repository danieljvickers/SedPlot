name: Test

on:
  push:
    tags:
      - 'v*'  # Builds on version tags like v1.0
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          brew install python-tk
  
      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          printf "%s" "$MAC_CERT_P12_BASE64" | base64 --decode > developer_id.p12
          security create-keychain -p "" build.keychain
          security import developer_id.p12 -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain || true
          rm developer_id.p12

      - name: Build with PyInstaller
        shell: bash
        run: |
          cat > hello.py <<'PY'
          #!/usr/bin/env python3
          import tkinter as tk
          from tkinter import messagebox

          def main():
              root = tk.Tk()
              root.withdraw()  # hide main window
              messagebox.showinfo("Hello", "Hello, world!")
              root.destroy()

          if __name__ == "__main__":
              main()
          PY
          

          chmod +x hello.py
          cp .github/specs/hello.spec .
          pyinstaller hello.spec --noconfirm

          ls -R dist/


      - name: Code sign binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_PATH="dist/hello"
          mv "$APP_PATH" "$APP_PATH.app"
          APP_EXECUTABLE=$(find "dist/hello.app" -type f -name "hello" -perm +111 | head -n 1)
          IDENTITY=$(security find-identity -p codesigning -v | grep -E 'Developer ID Application|Mac Developer' | head -n1 | awk -F\" '{print $2}')

          echo "Using identity: $IDENTITY"
          security unlock-keychain -p "" build.keychain

          echo "Signing hello Executable at: $APP_EXECUTABLE"
          codesign --verbose=4 --force --options runtime --timestamp --sign "$IDENTITY" "$APP_EXECUTABLE"

          echo "Signing App at: dist/hello.app"
          codesign --verbose=4 --force --deep --options runtime --timestamp --entitlements .github/codesign_xml/entitlements_test.plist --sign "$IDENTITY" "dist/hello.app"

          codesign --verify --verbose=4 "dist/hello.app"

      - name: Notarize Binary
        if: runner.os == 'macOS'
        shell: bash
        env:
          AC_API_KEY: ${{ secrets.AC_API_KEY }}
          AC_KEY_ID: ${{ secrets.AC_KEY_ID }}
          AC_ISSUER_ID: ${{ secrets.AC_ISSUER_ID }}
        run: |
          zip -r dist/hello.app.zip dist/hello.app
          ditto -c -k --sequesterRsrc --keepParent "dist/hello.app" "dist/hello.app.zip"
          
          echo "$AC_API_KEY" > AuthKey.p8
          xcrun notarytool submit dist/hello.app.zip \
            --key AuthKey.p8 \
            --key-id "$AC_KEY_ID" \
            --issuer "$AC_ISSUER_ID" \
            --wait
          xcrun stapler staple dist/hello.app
          xcrun stapler validate dist/hello.app || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-binary
          path: dist/*
